name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm run build` stamps the version into manifest.json and
      # src/version.ts. If that produces a diff, the committed files were
      # stale — fail here rather than shipping a mislabelled release.
      - name: Verify generated files are in sync
        run: git diff --exit-code
      - run: npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: rb209-mcp-mcpb
          path: rb209-mcp.mcpb
