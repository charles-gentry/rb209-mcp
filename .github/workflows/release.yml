name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # The tag must match package.json, or users would download a .mcpb whose
      # internal version disagrees with the release they took it from.
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run bundle
      - name: Publish release with the .mcpb bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Match the existing release convention, e.g.
          # "v0.2.4 — ask all inputs, no assumptions".
          #
          # Read the annotation over the API rather than from the checkout:
          # actions/checkout writes refs/tags/<tag> pointing straight at the
          # commit, so git's %(contents:subject) silently falls through to the
          # commit message. That shipped v0.3.0 titled "Merge pull request #15".
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
                  --jq '.object | "\(.type) \(.sha)"')
          subject=""
          if [ "${obj%% *}" = "tag" ]; then
            subject=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj##* }" \
                        --jq '.message' | head -1)
          fi
          if [ -n "$subject" ]; then
            title="$GITHUB_REF_NAME — $subject"
          else
            title="$GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" rb209-mcp.mcpb \
            --title "$title" --generate-notes
